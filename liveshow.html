<!DOCTYPE html>
<html lang="id">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Live Show - JKT48 Show Theater</title>
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.107.0"></script>
<link rel="stylesheet" href="css/liveshow.css">
<link rel="stylesheet" href="css/brutal.css">
<style>
/* ================================================================
   OVERRIDE KHUSUS liveshow.html — dimuat TERAKHIR agar menang dari
   brutal.css (brutal.css memakai !important)
   ================================================================ */

/* --- 1. Banner pink jangan setinggi layar ------------------------
   Di HP, .show-left-panel dipaksa setinggi layar oleh brutal.css:2018
   (`height:calc(100vh - ...)`), lalu .live-show-header jadi flex column
   (brutal.css:1981) dan .setlist-banner-container dapat `flex:1 1 auto`
   (brutal.css:1994).

   Diukur di 393x852: container = 508px, gambar = 202px -> ada ~306px
   warna pink kosong di bawah logo. Di layar sempit layout-nya satu kolom
   biasa, jadi panel & header harus ikut tinggi isinya, dan container
   banner cuma setinggi gambarnya. */
@media (max-width:1024px){
  body.page-liveshow .show-left-panel{
    height:auto!important;
    min-height:0!important;
    overflow:visible!important;
  }
  body.page-liveshow .live-show-header{
    height:auto!important;
    min-height:0!important;
    overflow:visible!important;
  }
  body.page-liveshow .setlist-banner-container{
    flex:0 0 auto!important;
    height:auto!important;
    min-height:0!important;
    overflow:hidden!important;
    margin-bottom:10px!important;
  }
  body.page-liveshow .banner-fallback{
    flex:0 0 auto!important;
    height:auto!important;
  }
  /* Banner dipotong jadi rasio 16:9 supaya tidak ada area kosong,
     persis seperti grid card member di halaman utama. */
  body.page-liveshow .setlist-banner{
    width:100%!important;
    max-width:100%!important;
    height:auto!important;
    max-height:none!important;
    aspect-ratio:16/9!important;
    object-fit:cover!important;
    object-position:center 22%!important;
    border-radius:10px!important;
    margin:0 auto!important;
  }
}

/* --- 1b. Laptop: banner isi penuh panel, jangan ada pita pink ---
   Di layout 2 kolom, .setlist-banner-container tetap flex:1, tapi
   gambar sesuai ukuran aslinya (object-fit:contain) cuma 229px
   sedangkan container 367px -> 138px warna setlist kosong di bawah logo.
   Gambar dibuat object-fit:cover setinggi container supaya tidak ada
   pita kosong. */
@media (min-width:1025px){
  body.page-liveshow .setlist-banner{
    width:100%!important;
    max-width:100%!important;
    height:100%!important;
    max-height:none!important;
    object-fit:cover!important;
    object-position:center 22%!important;
    border-radius:10px!important;
  }
}

/* --- 2. Grid member 4 kolom di HP --------------------------------
   liveshow.css:163 & 181 memaksa 2 kolom di HP, padahal halaman utama
   (index.css:107) sudah 4 kolom. Samakan supaya satu device = 4 kartu. */
@media (max-width:767px){
  body.page-liveshow .members-grid{
    grid-template-columns:repeat(4,minmax(0,1fr))!important;
    gap:8px!important;
  }
  body.page-liveshow .member-info{padding:6px 3px 7px!important;gap:3px!important}

  /* brutal.css:2293-2320 mengubah .member-info jadi
     `display:grid; grid-template-columns:auto minmax(0,1fr)`. Aturan itu
     untuk header member di riwayat.html, tapi bocor ke kartu member
     liveshow. Akibatnya .member-name dapat lebar 0px dan teksnya jadi
     satu huruf per baris (tinggi 71px) sehingga nama tidak terlihat sama
     sekali. Kartu dikembalikan ke flow flex kolom. */
  body.page-liveshow .member-card .member-info{
    display:flex!important;
    flex-direction:column!important;
    align-items:center!important;
    gap:3px!important;
  }
  body.page-liveshow .member-card .member-name{
    grid-column:auto!important;
    grid-row:auto!important;
  }

  /* Nama member: pada kolom 4 (lebar ~88px) .member-name ikut menyusut
     jadi 0px karena align-items:center + display:-webkit-box, jadi
     namanya hilang sama sekali. Dilepas dari -webkit-box dan diberi
     lebar penuh. */
  body.page-liveshow .member-name{
    display:block!important;
    -webkit-line-clamp:unset!important;
    -webkit-box-orient:initial!important;
    width:100%!important;
    min-width:0!important;
    min-height:0!important;
    font-size:9.5px!important;
    line-height:1.25!important;
    letter-spacing:0!important;
    white-space:normal!important;
    overflow-wrap:anywhere!important;
    margin-bottom:0!important;
  }

  /* Chip "Gen 6 • Dream": brutal.css:2074 memakai white-space:nowrap,
     sedangkan kolom 4 hanya ~88px sehingga teksnya terpotong
     ("Gen 6 • Dre"). Dibuat ringkas dan boleh membungkus. */
  body.page-liveshow .member-gen{
    width:100%!important;
    font-size:7.5px!important;
    letter-spacing:0!important;
    padding:1px 2px!important;
    line-height:1.15!important;
    white-space:normal!important;
    border-width:1px!important;
    box-shadow:1px 1px 0 rgba(0,0,0,.45)!important;
    overflow-wrap:anywhere!important;
  }
}
@media (max-width:360px){
  body.page-liveshow .members-grid{gap:6px!important}
  body.page-liveshow .member-name{font-size:9px!important}
}
</style>
</head>

</html>
