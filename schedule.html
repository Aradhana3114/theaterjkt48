<!DOCTYPE html>
<html lang="id">
<head>
<link rel="icon" type="image/png" href="img/favicon-theater-jkt48.png">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jadwal Show - JKT48 Show Theater</title>
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.107.0"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/moment.js/2.29.4/moment.min.js"></script>
<link rel="stylesheet" href="css/schedule.css">
<link rel="stylesheet" href="css/brutal.css">
</head>
<body>
<header class="main-header">
  <div class="theater-header" onclick="window.location.replace('index.html')" style="cursor:pointer">JKT48 SHOW THEATER</div>
  <div class="detail-header">
    <button onclick="goBack()" class="back-btn">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M19 12H5M12 19l-7-7 7-7"/>
      </svg>
      Beranda
    </button>
    <div class="detail-title">Schedule</div>
  </div>
</header>

<div class="container">
  <div class="calendar-section">
    <div class="calendar-header">
      <div class="calendar-nav">
        <button onclick="changeMonth(-1)" title="Bulan sebelumnya">
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="currentColor" viewBox="0 0 16 16">
            <path fill-rule="evenodd" d="M12 8a.5.5 0 0 1-.5.5H5.707l2.147 2.146a.5.5 0 0 1-.708.708l-3-3a.5.5 0 0 1 0-.708l3-3a.5.5 0 1 1 .708.708L5.707 7.5H11.5a.5.5 0 0 1 .5.5z"/>
          </svg>
        </button>
      </div>
      <h3 class="calendar-title" id="currentMonth">Januari 2024</h3>
      <div class="calendar-nav">
        <button onclick="changeMonth(1)" title="Bulan berikutnya">
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="currentColor" viewBox="0 0 16 16">
            <path fill-rule="evenodd" d="M4 8a.5.5 0 0 1 .5-.5h5.793L8.146 5.354a.5.5 0 1 1 .708-.708l3 3a.5.5 0 0 1 0 .708l-3 3a.5.5 0 0 1-.708-.708L10.293 8.5H4.5A.5.5 0 0 1 4 8"/>
          </svg>
        </button>
      </div>
    </div>
    <div class="calendar-grid" id="calendar"></div>
  </div>

  <div class="shows-section">
    <div class="section-title">
      <span>Daftar Show</span>
      <span class="shows-count" id="showsCount">0</span>
    </div>
    <div id="showList">
      <div class="loading">
        <div class="spinner"></div>
        <span>Memuat jadwal show...</span>
      </div>
    </div>
  </div>
</div>

<footer class="detail-footer">
  <p>© 2026 Show Theater. Data diperbarui secara real-time</p>
</footer>

<script src="js/utils.js"></script>
<script src="js/schedule.js"></script>
</body>
</html>
